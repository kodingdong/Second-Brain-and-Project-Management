<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Retraq — Personal Projects</title>
    <meta name="description" content="Retraq — PWA personal untuk tracking proyek pribadi, offline-first.">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Retraq">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">◈</span>
                <div>
                    <strong>Retraq</strong>
                    <span class="brand-tag" style="line-height: 1.3; margin-top: 0.15rem; font-size: 0.7rem;">Capture, Connect, Execute. Your Actionable Second Brain</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#/" class="nav-link" data-route="/">Dashboard</a>
                <a href="#/projects" class="nav-link" data-route="/projects">Projects</a>
                <a href="#/inbox" class="nav-link" data-route="/inbox">Inbox <span class="nav-badge" id="inbox-badge" hidden></span></a>
                <a href="#/daily" class="nav-link" data-route="/daily">Daily Notes</a>
                <a href="#/library" class="nav-link" data-route="/library">Library</a>
                <a href="#/areas" class="nav-link" data-route="/areas">Areas</a>
                <a href="#/habits" class="nav-link" data-route="/habits">Habits</a>
                <a href="#/search" class="nav-link" data-route="/search">Search</a>
                <a href="#/review" class="nav-link" data-route="/review">Review</a>
                <a href="#/settings" class="nav-link" data-route="/settings">Settings</a>
            </nav>
            <div class="sidebar-footer">
                <span class="muted">Offline · Local-first</span>
            </div>
        </aside>

        <div class="main-column">
            <header class="topbar">
                <button type="button" class="btn-icon menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
                <h1 class="page-title" id="page-title">Dashboard</h1>
                <button type="button" class="btn btn-primary btn-sm" id="header-action" hidden>+ New Project</button>
            </header>

            <main id="app-content" class="content">
                <div id="view-dashboard" class="view"></div>
                <div id="view-projects" class="view" hidden></div>
                <div id="view-project-detail" class="view" hidden></div>
                <div id="view-inbox" class="view" hidden></div>
                <div id="view-daily" class="view" hidden></div>
                <div id="view-library" class="view" hidden></div>
                <div id="view-areas" class="view" hidden></div>
                <div id="view-habits" class="view" hidden></div>
                <div id="view-search" class="view" hidden></div>
                <div id="view-review" class="view" hidden></div>
                <div id="view-settings" class="view" hidden></div>
            </main>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
        <a href="#/" class="bottom-nav-item" data-route="/">
            <span class="bottom-nav-icon">⊞</span>
            <span class="bottom-nav-label">Home</span>
        </a>
        <a href="#/projects" class="bottom-nav-item" data-route="/projects">
            <span class="bottom-nav-icon">◧</span>
            <span class="bottom-nav-label">Projects</span>
        </a>
        <button type="button" class="bottom-nav-fab" id="bottom-capture" aria-label="Quick capture">+</button>
        <a href="#/inbox" class="bottom-nav-item" data-route="/inbox">
            <span class="bottom-nav-icon">◫</span>
            <span class="bottom-nav-label">Inbox</span>
            <span class="bottom-nav-badge" id="inbox-badge-bottom" hidden></span>
        </a>
        <button type="button" class="bottom-nav-item" id="bottom-more" aria-label="More">
            <span class="bottom-nav-icon">≡</span>
            <span class="bottom-nav-label">More</span>
        </button>
    </nav>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/db.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/bilinks.js"></script>
    <script src="js/capture.js"></script>
    <script src="js/inbox.js"></script>
    <script src="js/daily-notes.js"></script>
    <script src="js/library.js"></script>
    <script src="js/areas.js"></script>
    <script src="js/search.js"></script>
    <script src="js/habits.js"></script>
    <script src="js/review.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/project-detail.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.warn('Service worker registration failed:', err);
            });
        }
    </script>
</body>
</html>
